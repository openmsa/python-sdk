name: 📝 Update documentation

on:
  push:
    branches:
      - master
    paths:
      - 'msa_sdk/*'
      - '!msa_sdk/__init__.py'
env:
  GITHUB_TOKEN: ${{ secrets.OPENMSA_GITHUB_TOKEN }}

jobs:
  pull-request:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: 3.12

    - name: Install dependencies
      run: |
        DIR=$(pwd)
        cd ../
        python -m pip install --upgrade pip
        if [ -f ${DIR}/requirements.txt ]; then pip install -r ${DIR}/requirements.txt ; fi
        if [ -f ${DIR}/requirements-dev.txt ]; then pip install -r ${DIR}/requirements-dev.txt ; fi

    - name: Generate doc
      run: |
        pdoc --html --force -o msa_sdk_doc msa_sdk
        cp msa_sdk.json msa_sdk_doc/msa_sdk

    - name: Create pull request
      env:
        API_TOKEN_GITHUB: ${{ secrets.MSA_DOCKER_REPO_ACCESS_TOKEN }}
        GH_TOKEN: ${{ secrets.MSA_DOCKER_REPO_ACCESS_TOKEN }}
      run: |
        CLONE_DIR=$(mktemp -d)
        git config --global user.email 'qa@ubiqube.com'
        git config --global user.name 'qa4ubiqube'

        git clone "https://${API_TOKEN_GITHUB}@github.com/ubiqube/msa-front.git" "$CLONE_DIR"

        cd "$CLONE_DIR"
        git fetch -a

        BRANCH_EXISTS=$(git show-ref update_pythonsdk_doc | wc -l)

        if [ "$BRANCH_EXISTS" -gt 0 ]; then
          git checkout update_pythonsdk_doc
        else
          git checkout -b update_pythonsdk_doc
        fi

        mkdir -p msa_sdk_doc
        cp -r "${GITHUB_WORKSPACE}/msa_sdk_doc/msa_sdk/." msa_sdk_doc/

        git add -A

        if git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        fi

        git commit -m 'MSA-15028: 📚 Update documentation automatic created.'
        git push "https://${API_TOKEN_GITHUB}@github.com/ubiqube/msa-front.git" update_pythonsdk_doc

        gh pr create \
          --repo ubiqube/msa-front \
          --head update_pythonsdk_doc \
          --base master \
          --title 'MSA-15028: 📚 Update Python SDK documentation.' \
          --body 'update_pythonsdk_doc' \
          || echo "PR already exists or could not be created"
